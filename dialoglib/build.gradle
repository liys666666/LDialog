plugins {
    alias(libs.plugins.android.library)
    alias(libs.plugins.kotlin.android)
    id 'maven-publish'
}

group = providers.environmentVariable('GROUP')
        .orElse('com.gitee.liys666666')
        .get()
version = providers.gradleProperty('VERSION_NAME')
        .orElse(providers.environmentVariable('VERSION'))
        .orElse('3.0.0-SNAPSHOT')
        .get()

android {
    namespace 'com.liys.dialoglib'
    compileSdk 36

    defaultConfig {
        minSdk 21
        consumerProguardFiles 'proguard-rules.pro'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
}

kotlin {
    jvmToolchain(17)
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8
    }
}

dependencies {
    api libs.androidx.appcompat

    testImplementation libs.junit4
    androidTestImplementation libs.androidx.test.junit
    androidTestImplementation libs.androidx.test.espresso.core
}

publishing {
    publications {
        release(MavenPublication) {
            groupId = project.group
            artifactId = 'LDialog'
            version = project.version

            afterEvaluate {
                from components.release
            }

            pom {
                name = 'LDialog'
                description = 'A lightweight Android dialog library.'
                url = 'https://gitee.com/liys666666/LDialog'
                scm {
                    connection = 'scm:git:https://gitee.com/liys666666/LDialog.git'
                    developerConnection = 'scm:git:ssh://git@gitee.com/liys666666/LDialog.git'
                    url = 'https://gitee.com/liys666666/LDialog'
                }
            }
        }
    }
}
